<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#10110f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Measure Calc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Measure Calculator</title>
  <style>
:root {
  --page: #10110f;
  --panel: #181a17;
  --panel-2: #20231f;
  --screen: #0b0c0a;
  --border: #343832;
  --text: #f5f4ee;
  --muted: #9ea399;
  --accent: #d9b85f;
  --accent-strong: #f1cf72;
  --number: #edece6;
  --number-text: #161713;
  --operator: #363b34;
  --utility: #292d28;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
  --radius: 24px;
}

* { box-sizing: border-box; }
html { color-scheme: dark; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding:
    max(6px, env(safe-area-inset-top))
    max(6px, env(safe-area-inset-right))
    max(6px, env(safe-area-inset-bottom))
    max(6px, env(safe-area-inset-left));
  background:
    radial-gradient(circle at 10% 8%, rgba(217, 184, 95, 0.11), transparent 23rem),
    var(--page);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}

button { font: inherit; }
button:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px; }
[hidden] { display: none !important; }

.calculator-app {
  width: min(100%, 460px);
  height: calc(100dvh - max(12px, env(safe-area-inset-top) + env(safe-area-inset-bottom)));
  margin: 0 auto;
}

.calculator-card {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.control-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  flex: 0 0 auto;
  padding: 10px 12px 8px;
}

.control-button {
  min-height: 44px;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
  border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 13%, var(--panel-2));
  color: var(--accent-strong);
  font-weight: 850;
  letter-spacing: 0.05em;
  cursor: pointer;
  touch-action: manipulation;
}

.control-button > span { margin-left: 4px; font-size: 1.02rem; }
.control-button:active { filter: brightness(0.88); }
.control-button:disabled {
  border-color: var(--border);
  background: var(--panel-2);
  color: #6f746c;
  cursor: default;
  opacity: 0.6;
}

.mode-toggle-button.measure-active {
  background: var(--accent);
  color: #17150f;
}

.unit-button.active {
  background: var(--accent);
  color: #17150f;
}

.measure-tools {
  flex: 0 0 auto;
  padding: 0 12px 8px;
}

.precision-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 0.72rem;
}

.precision-control > span {
  flex: 0 0 auto;
  font-weight: 700;
  letter-spacing: 0.03em;
}

.precision-control > div {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  flex: 1;
}

.precision-control button {
  min-height: 32px;
  padding: 0 6px;
  border: 0;
  border-radius: 9px;
  background: var(--panel-2);
  color: var(--muted);
  font-weight: 800;
  cursor: pointer;
}

.precision-control button.active {
  background: var(--accent);
  color: #15140f;
}

.display-wrap {
  display: grid;
  grid-template-rows: 15px 22px minmax(52px, 1fr) 50px; 
  flex: 0 0 166px; 
  height: 166px;   
  min-height: 166px; 
  margin: 0 10px 8px;
  padding: 11px 13px 12px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--screen);
  overflow: hidden;
}

.display-wrap .result-equation[hidden] {
  display: block !important;
  visibility: hidden;
}

.display-wrap .conversion-results[hidden] {
  display: grid !important;
  visibility: hidden;
}

.display-label {
  display: block;
  min-height: 15px;
  margin-bottom: 3px;
  color: #888d83;
  font-size: 0.64rem;
  text-transform: uppercase;
  letter-spacing: 0.11em;
}

.result-equation {
  min-height: 18px;
  margin: 1px 0 4px;
  color: #9da198;
  font-size: clamp(0.72rem, 2.8vw, 0.88rem);
  font-weight: 650;
  line-height: 1.25;
  text-align: right;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  overflow-wrap: normal;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.result-equation::-webkit-scrollbar { display: none; }

.display {
  align-self: stretch;
  width: 100%;
  min-height: 52px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent-strong);
  font-size: clamp(1.9rem, 8.5vw, 3rem);
  font-weight: 800;
  line-height: 1.04;
  text-align: right;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  overflow-wrap: normal;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  cursor: copy;
  touch-action: pan-x;
}

.display::-webkit-scrollbar { display: none; }

.display.expression {
  color: #e2e0d8;
  font-size: clamp(1.2rem, 5.4vw, 1.8rem);
}

.display.error { color: #ff8d82; font-size: 1.05rem; }

.conversion-results {
  display: grid;
  min-height: 42px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.conversion-item {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: right;
  cursor: copy;
  touch-action: manipulation;
}

.conversion-item:active { opacity: 0.72; }

.conversion-item span {
  display: block;
  margin-bottom: 2px;
  color: #888d83;
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conversion-item strong {
  display: block;
  color: var(--text);
  font-size: clamp(0.8rem, 3.1vw, 0.98rem);
  font-weight: 750;
  line-height: 1.18;
  overflow-wrap: anywhere;
}

.memory-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 8px;
  height: 42px;
  flex: 0 0 auto;
}

.memory-btn {
  width: 42px;
  height: 100%;
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--accent-strong);
  font-weight: 800;
  cursor: pointer;
  flex-shrink: 0;
}

.memory-bank {
  display: flex;
  gap: 6px;
  flex: 1;
  height: 100%;
  overflow-x: auto;
  align-items: center;
  scrollbar-width: none;
}

.memory-bank::-webkit-scrollbar { display: none; }

.memory-tag {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--utility);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}

.memory-tag:active { filter: brightness(0.8); }

.fraction-browser {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  gap: 4px;
  flex: 0 0 42px;
  min-height: 0;
  padding: 0 10px 8px;
}

.fraction-nav {
  width: 34px;
  min-width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  border-radius: 8px;
  background: color-mix(in srgb, var(--accent) 15%, var(--panel-2));
  color: var(--accent-strong);
  font-size: 1.35rem;
  font-weight: 850;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
}

.fraction-nav:active { filter: brightness(0.86); }
.fraction-nav:disabled {
  border-color: var(--border);
  color: #5f645c;
  background: var(--panel-2);
  opacity: 0.65;
}

.fraction-palette {
  display: grid;
  grid-template-rows: 34px;
  grid-auto-flow: column;
  grid-auto-columns: 52px;
  gap: 4px;
  min-width: 0;
  min-height: 0;
  padding: 0;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-inline: contain;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.fraction-palette::-webkit-scrollbar { display: none; }

.fraction-palette button {
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--accent-strong);
  font-size: 0.66rem;
  font-weight: 750;
  cursor: pointer;
  scroll-snap-align: start;
  touch-action: manipulation;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  flex: 1 1 auto;
  min-height: 0;
  padding: 8px 10px 10px;
  background: var(--panel-2);
}

.keypad-standard { grid-template-rows: repeat(5, minmax(42px, 1fr)); }
.keypad-measure { grid-template-rows: repeat(6, minmax(40px, 1fr)); }

.key {
  min-width: 0;
  min-height: 0;
  border: 0;
  border-radius: 12px;
  font-size: clamp(1.05rem, 4.5vw, 1.25rem);
  font-weight: 800;
  cursor: pointer;
  transition: filter 0.12s ease, transform 0.06s ease;
  touch-action: manipulation;
}

.key:hover { filter: brightness(1.07); }
.key:active { transform: translateY(1px); filter: brightness(0.9); }
.key.number { background: var(--number); color: var(--number-text); }
.key.operator { background: var(--operator); color: #fff; font-size: clamp(1.2rem, 5vw, 1.45rem); }
.key.utility { background: var(--utility); color: var(--text); }
.key.measure-key { background: color-mix(in srgb, var(--accent) 22%, var(--utility)); color: var(--accent-strong); }
.key.equals { background: var(--accent); color: #17150f; font-size: clamp(1.3rem, 5.3vw, 1.55rem); }
.key.pending { box-shadow: inset 0 0 0 3px var(--accent-strong); }
.span-3 { grid-column: span 3; }

.toast {
  position: fixed;
  left: 50%;
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 1000;
  transform: translate(-50%, 12px);
  padding: 9px 14px;
  border-radius: 999px;
  background: var(--accent);
  color: #17150f;
  font-size: 0.78rem;
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 480px) {
  body { padding: 0; }
  .calculator-app { width: 100%; height: 100dvh; }
  .calculator-card { border: 0; border-radius: 0; box-shadow: none; }
  .control-row { padding-top: max(8px, env(safe-area-inset-top)); }
  .keypad { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
}

@media (max-height: 720px) {
  .control-row { padding-top: 6px; padding-bottom: 6px; }
  .control-button { min-height: 38px; }
  .measure-tools { padding-bottom: 5px; }
  .precision-control button { min-height: 28px; }
  .display-wrap {
    grid-template-rows: 15px 20px minmax(42px, 1fr) 46px;
    flex-basis: 145px;
    height: 145px;
    min-height: 145px;
    padding-block: 8px;
    margin-bottom: 5px;
  }
  .display { min-height: 42px; }
  .fraction-browser {
    grid-template-columns: 30px minmax(0, 1fr) 30px;
    flex-basis: 38px;
  }
  .fraction-nav { width: 30px; min-width: 30px; height: 30px; }
  .fraction-palette {
    grid-template-rows: 30px;
    grid-auto-columns: 48px;
  }
  .keypad { gap: 5px; padding-top: 6px; }
}

@media (max-width: 340px) {
  .conversion-results { grid-template-columns: 1fr; }
  .fraction-palette { grid-auto-columns: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
  </style>
</head>
<body>
<div class="calculator-app" id="calculatorApp">
  <section class="calculator-card" aria-label="Calculator">
    <div class="control-row" id="controlRow">
      <button type="button" class="control-button unit-button" id="feetButton" aria-label="Enter feet" aria-pressed="false">FT <span>'</span></button>
      <button type="button" class="control-button unit-button" id="inchesButton" aria-label="Enter inches" aria-pressed="false">IN <span>&quot;</span></button>
      <button type="button" class="control-button mode-toggle-button" id="modeToggle" aria-label="Switch to Measure mode" aria-pressed="false">Standard</button>
    </div>

    <div class="measure-tools" id="measureTools" hidden>
      <div class="precision-control" aria-label="Fraction increments and result rounding">
        <span>Fraction size</span>
        <div id="precisionButtons">
          <button type="button" data-precision="8" aria-pressed="false" title="Use eighth-inch fractions">1/8</button>
          <button type="button" data-precision="16" class="active" aria-pressed="true" title="Use sixteenth-inch fractions">1/16</button>
          <button type="button" data-precision="32" aria-pressed="false" title="Use thirty-second-inch fractions">1/32</button>
        </div>
      </div>
    </div>

    <div class="display-wrap">
      <span class="display-label" id="displayLabel">Ready</span>
      <div class="result-equation" id="resultEquation" hidden></div>
      <button type="button" class="display" id="display" aria-label="Calculator display. Select to copy." title="Select to copy">0</button>

      <div class="conversion-results" id="conversionResults" hidden aria-label="Measurement conversions">
        <button type="button" class="conversion-item" id="conversionPrimaryButton" title="Select to copy">
          <span id="conversionPrimaryLabel">Total inches</span>
          <strong id="conversionPrimaryResult">0 in</strong>
        </button>
        <button type="button" class="conversion-item" id="conversionSecondaryButton" title="Select to copy">
          <span id="conversionSecondaryLabel">Decimal feet</span>
          <strong id="conversionSecondaryResult">0 ft</strong>
        </button>
      </div>

      <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <div class="memory-tools" id="memoryTools" aria-label="Scrap Lumber Memory">
      <button type="button" class="memory-btn" data-action="memory-clear">MC</button>
      <div class="memory-bank" id="memoryBank">
        <!-- Saved scraps will appear here -->
      </div>
      <button type="button" class="memory-btn" data-action="memory-add">M+</button>
    </div>

    <div class="fraction-browser" id="fractionBrowser" hidden aria-label="Fraction picker">
      <button type="button" class="fraction-nav" id="fractionPrev" aria-label="Show previous fractions">‹</button>
      <div class="fraction-palette" id="fractionPalette" aria-label="Available fractions"></div>
      <button type="button" class="fraction-nav" id="fractionNext" aria-label="Show more fractions">›</button>
    </div>

    <div class="keypad keypad-standard" id="keypadStandard" aria-label="Standard calculator keypad">
      <button type="button" class="key utility" data-action="clear">AC</button>
      <button type="button" class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="key utility" data-action="percent">%</button>
      <button type="button" class="key operator" data-operator="/">÷</button>

      <button type="button" class="key number" data-value="7">7</button>
      <button type="button" class="key number" data-value="8">8</button>
      <button type="button" class="key number" data-value="9">9</button>
      <button type="button" class="key operator" data-operator="*">×</button>

      <button type="button" class="key number" data-value="4">4</button>
      <button type="button" class="key number" data-value="5">5</button>
      <button type="button" class="key number" data-value="6">6</button>
      <button type="button" class="key operator" data-operator="-">−</button>

      <button type="button" class="key number" data-value="1">1</button>
      <button type="button" class="key number" data-value="2">2</button>
      <button type="button" class="key number" data-value="3">3</button>
      <button type="button" class="key operator" data-operator="+">+</button>

      <button type="button" class="key utility" data-action="sign">±</button>
      <button type="button" class="key number" data-value="0">0</button>
      <button type="button" class="key number" data-value=".">.</button>
      <button type="button" class="key equals" data-action="equals">=</button>
    </div>

    <div class="keypad keypad-measure" id="keypadMeasure" aria-label="Measurement calculator keypad" hidden>
      <button type="button" class="key utility" data-action="clear">AC</button>
      <button type="button" class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="key utility" data-action="open-paren">(</button>
      <button type="button" class="key utility" data-action="close-paren">)</button>

      <button type="button" class="key number" data-value="7">7</button>
      <button type="button" class="key number" data-value="8">8</button>
      <button type="button" class="key number" data-value="9">9</button>
      <button type="button" class="key operator" data-operator="/">÷</button>

      <button type="button" class="key number" data-value="4">4</button>
      <button type="button" class="key number" data-value="5">5</button>
      <button type="button" class="key number" data-value="6">6</button>
      <button type="button" class="key operator" data-operator="*">×</button>

      <button type="button" class="key number" data-value="1">1</button>
      <button type="button" class="key number" data-value="2">2</button>
      <button type="button" class="key number" data-value="3">3</button>
      <button type="button" class="key operator" data-operator="-">−</button>

      <button type="button" class="key utility" data-action="sign">±</button>
      <button type="button" class="key number" data-value="0">0</button>
      <button type="button" class="key number" data-value=".">.</button>
      <button type="button" class="key operator" data-operator="+">+</button>

      <button type="button" class="key measure-key" data-action="fraction-slash" aria-label="Fraction slash">/</button>
      <button type="button" class="key equals span-3" data-action="equals">=</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'personalMeasureCalculatorV15';

  class Fraction {
    constructor(numerator, denominator = 1n) {
      numerator = BigInt(numerator);
      denominator = BigInt(denominator);
      if (denominator === 0n) throw new Error('Division by zero');
      if (denominator < 0n) {
        numerator = -numerator;
        denominator = -denominator;
      }
      const divisor = Fraction.gcd(Fraction.abs(numerator), denominator);
      this.n = numerator / divisor;
      this.d = denominator / divisor;
    }
    static abs(value) { return value < 0n ? -value : value; }
    static gcd(a, b) {
      while (b !== 0n) { const remainder = a % b; a = b; b = remainder; }
      return a || 1n;
    }
    static fromDecimalText(text) {
      const cleaned = String(text).trim();
      if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(cleaned)) throw new Error('Malformed number');
      if (!cleaned.includes('.')) return new Fraction(BigInt(cleaned), 1n);
      const [whole = '0', decimal = ''] = cleaned.split('.');
      const denominator = 10n ** BigInt(decimal.length);
      const numerator = BigInt((whole || '0') + decimal);
      return new Fraction(numerator, denominator);
    }
    add(other) { return new Fraction(this.n * other.d + other.n * this.d, this.d * other.d); }
    sub(other) { return new Fraction(this.n * other.d - other.n * this.d, this.d * other.d); }
    mul(other) { return new Fraction(this.n * other.n, this.d * other.d); }
    div(other) {
      if (other.n === 0n) throw new Error('Division by zero');
      return new Fraction(this.n * other.d, this.d * other.n);
    }
    neg() { return new Fraction(-this.n, this.d); }
    toNumber() { return Number(this.n) / Number(this.d); }
  }

  const state = {
    input: '', evalInput: '', mode: 'standard', precision: 16,
    resultAsFeet: false, currentResult: null, repeatOperation: null,
    lastEquation: '', justCalculated: false, displayError: false,
    currentDimension: 0
  };

  const $ = id => document.getElementById(id);
  const display = $('display'), displayLabel = $('displayLabel');
  const resultEquation = $('resultEquation'), conversionResults = $('conversionResults');
  const conversionPrimaryButton = $('conversionPrimaryButton');
  const conversionPrimaryLabel = $('conversionPrimaryLabel');
  const conversionPrimaryResult = $('conversionPrimaryResult');
  const conversionSecondaryButton = $('conversionSecondaryButton');
  const conversionSecondaryLabel = $('conversionSecondaryLabel');
  const conversionSecondaryResult = $('conversionSecondaryResult');
  const announcer = $('announcer'), measureTools = $('measureTools');
  const fractionBrowser = $('fractionBrowser'), fractionPalette = $('fractionPalette');
  const fractionPrev = $('fractionPrev'), fractionNext = $('fractionNext');
  const feetButton = $('feetButton'), inchesButton = $('inchesButton');
  const modeToggle = $('modeToggle'), keypadStandard = $('keypadStandard');
  const keypadMeasure = $('keypadMeasure'), toastElement = $('toast');
  const memoryBank = $('memoryBank');
  
  let scrapMemory = [];
  let toastTimer;

  // Web Audio Context for haptics
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const hapticCtx = new AudioContext();

  function vibrate() {
    if (hapticCtx.state === 'suspended') hapticCtx.resume();
    const osc = hapticCtx.createOscillator();
    const gainNode = hapticCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(hapticCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, hapticCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(0.01, hapticCtx.currentTime + 0.04);
    gainNode.gain.setValueAtTime(0.8, hapticCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, hapticCtx.currentTime + 0.04);
    osc.start(hapticCtx.currentTime);
    osc.stop(hapticCtx.currentTime + 0.04);
  }

  function normalizeOperators(text) {
    return String(text).replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  }

  function formatOperator(operator) {
    return { '+': '+', '-': '−', '*': '×', '/': '÷' }[operator] || operator;
  }

  function parseNumericLiteral(text) {
    const cleaned = String(text).trim();
    let match = cleaned.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (match) {
      const denominator = BigInt(match[3]);
      if (denominator === 0n) throw new Error('Division by zero');
      return new Fraction(BigInt(match[1]), 1n).add(new Fraction(BigInt(match[2]), denominator));
    }
    match = cleaned.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (match) {
      const denominator = BigInt(match[2]);
      if (denominator === 0n) throw new Error('Division by zero');
      return new Fraction(BigInt(match[1]), denominator);
    }
    return Fraction.fromDecimalText(cleaned);
  }

  const NUMERIC_LITERAL = String.raw`(?:\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d*)?|\.\d+)`;
  const FEET_LITERAL_RE = new RegExp(`^(${NUMERIC_LITERAL})\s*'(?:\s*(${NUMERIC_LITERAL})\s*")?`);
  const INCH_LITERAL_RE = new RegExp(`^(${NUMERIC_LITERAL})\s*"`);
  const PLAIN_LITERAL_RE = new RegExp(`^(${NUMERIC_LITERAL})`);
  const INTERNAL_QUANTITY_RE = /^\[\[Q:(-?\d+)\/(\d+):(-?\d+)\]\]/;

  function encodeQuantity(fraction, dimension) {
    return `[[Q:${fraction.n}/${fraction.d}:${dimension}]]`;
  }

  function tokenize(rawExpression) {
    const expression = normalizeOperators(rawExpression);
    const tokens = [];
    let index = 0;
    while (index < expression.length) {
      const character = expression[index];
      if (/\s/.test(character)) { index += 1; continue; }
      const remaining = expression.slice(index);
      const internalMatch = remaining.match(INTERNAL_QUANTITY_RE);
      if (internalMatch) {
        tokens.push({ type: 'number', value: new Fraction(BigInt(internalMatch[1]), BigInt(internalMatch[2])), dimension: Number(internalMatch[3]), fixedDimension: true });
        index += internalMatch[0].length;
        continue;
      }
      if (character === '(' || character === ')') { tokens.push({ type: 'paren', value: character }); index += 1; continue; }
      if ('+-*/%'.includes(character)) { tokens.push({ type: 'operator', value: character }); index += 1; continue; }
      if (/\d|\./.test(character)) {
        const feetMatch = remaining.match(FEET_LITERAL_RE);
        if (feetMatch) {
          const feet = parseNumericLiteral(feetMatch[1]);
          const inches = feetMatch[2] ? parseNumericLiteral(feetMatch[2]) : new Fraction(0n);
          tokens.push({ type: 'number', value: feet.mul(new Fraction(12n)).add(inches), dimension: 1, fixedDimension: true });
          index += feetMatch[0].length;
          continue;
        }
        const inchMatch = remaining.match(INCH_LITERAL_RE);
        if (inchMatch) {
          tokens.push({ type: 'number', value: parseNumericLiteral(inchMatch[1]), dimension: 1, fixedDimension: true });
          index += inchMatch[0].length;
          continue;
        }
        const plainMatch = remaining.match(PLAIN_LITERAL_RE);
        if (!plainMatch) throw new Error('Malformed number');
        tokens.push({ type: 'number', value: parseNumericLiteral(plainMatch[1]), dimension: null, fixedDimension: false });
        index += plainMatch[0].length;
        continue;
      }
      throw new Error(`Unexpected character: ${character}`);
    }
    return insertImplicitMultiplication(tokens);
  }

  function insertImplicitMultiplication(tokens) {
    const result = [];
    for (const token of tokens) {
      const previous = result[result.length - 1];
      const previousCanMultiply = previous && (previous.type === 'number' || (previous.type === 'paren' && previous.value === ')') || (previous.type === 'operator' && previous.value === '%'));
      const currentCanMultiply = token.type === 'number' || (token.type === 'paren' && token.value === '(');
      if (previousCanMultiply && currentCanMultiply) result.push({ type: 'operator', value: '*' });
      result.push(token);
    }
    return result;
  }

  function parseExpression(tokens) {
    let position = 0;
    const peek = () => tokens[position];
    const consume = () => tokens[position++];
    function parseAdditive() {
      let node = parseMultiplicative();
      while (peek() && peek().type === 'operator' && ['+', '-'].includes(peek().value)) {
        const operator = consume().value;
        node = { type: 'binary', operator, left: node, right: parseMultiplicative() };
      }
      return node;
    }
    function parseMultiplicative() {
      let node = parsePostfix();
      while (peek() && peek().type === 'operator' && ['*', '/'].includes(peek().value)) {
        const operator = consume().value;
        node = { type: 'binary', operator, left: node, right: parsePostfix() };
      }
      return node;
    }
    function parsePostfix() {
      let node = parseUnary();
      while (peek() && peek().type === 'operator' && peek().value === '%') { consume(); node = { type: 'percent', value: node }; }
      return node;
    }
    function parseUnary() {
      if (peek() && peek().type === 'operator' && peek().value === '+') { consume(); return parseUnary(); }
      if (peek() && peek().type === 'operator' && peek().value === '-') { consume(); return { type: 'unary', operator: '-', value: parseUnary() }; }
      return parsePrimary();
    }
    function parsePrimary() {
      const token = peek();
      if (!token) throw new Error('Incomplete calculation');
      if (token.type === 'number') { consume(); return { type: 'number', value: token.value, dimension: token.dimension, fixedDimension: token.fixedDimension }; }
      if (token.type === 'paren' && token.value === '(') {
        consume();
        const node = parseAdditive();
        if (!peek() || peek().type !== 'paren' || peek().value !== ')') throw new Error('Unmatched parenthesis');
        consume();
        return node;
      }
      throw new Error('Expected a number');
    }
    const tree = parseAdditive();
    if (position < tokens.length) throw new Error(`Unexpected token: ${tokens[position].value}`);
    return tree;
  }

  function applyBasicOperation(left, operator, right) {
    switch (operator) {
      case '+': return left.add(right);
      case '-': return left.sub(right);
      case '*': return left.mul(right);
      case '/': return left.div(right);
      default: throw new Error('Unsupported operation');
    }
  }

  function makeQuantity(value, dimension = 0) { return { value, dimension }; }

  function nodeHasFixedDimension(node) {
    switch (node.type) {
      case 'number': return Boolean(node.fixedDimension);
      case 'unary': return nodeHasFixedDimension(node.value);
      case 'percent': return false;
      case 'binary': return nodeHasFixedDimension(node.left) || nodeHasFixedDimension(node.right);
      default: return false;
    }
  }

  function evaluateNodeQuantity(node, plainDimension = 0) {
    switch (node.type) {
      case 'number': return makeQuantity(node.value, node.fixedDimension ? node.dimension : plainDimension);
      case 'unary': { const quantity = evaluateNodeQuantity(node.value, plainDimension); return makeQuantity(quantity.value.neg(), quantity.dimension); }
      case 'percent': { const quantity = evaluateNodeQuantity(node.value, 0); return makeQuantity(quantity.value.div(new Fraction(100n)), 0); }
      case 'binary': return evaluateBinaryQuantity(node, plainDimension);
      default: throw new Error('Invalid calculation');
    }
  }

  function evaluateBinaryQuantity(node, plainDimension) {
    const { operator, left: leftNode, right: rightNode } = node;
    if (rightNode.type === 'percent') {
      const left = evaluateNodeQuantity(leftNode, plainDimension);
      const percentValue = evaluateNodeQuantity(rightNode.value, 0).value;
      const rate = percentValue.div(new Fraction(100n));
      switch (operator) {
        case '+': return makeQuantity(left.value.add(left.value.mul(rate)), left.dimension);
        case '-': return makeQuantity(left.value.sub(left.value.mul(rate)), left.dimension);
        case '*': return makeQuantity(left.value.mul(rate), left.dimension);
        case '/': return makeQuantity(left.value.div(percentValue).mul(new Fraction(100n)), left.dimension);
        default: throw new Error('Unsupported operation');
      }
    }
    const leftFixed = nodeHasFixedDimension(leftNode);
    const rightFixed = nodeHasFixedDimension(rightNode);
    let left; let right;
    if (operator === '+' || operator === '-') {
      if (leftFixed && !rightFixed) { left = evaluateNodeQuantity(leftNode, plainDimension); right = evaluateNodeQuantity(rightNode, 0); right.dimension = left.dimension; }
      else if (!leftFixed && rightFixed) { left = evaluateNodeQuantity(leftNode, 0); right = evaluateNodeQuantity(rightNode, plainDimension); left.dimension = right.dimension; }
      else { left = evaluateNodeQuantity(leftNode, plainDimension); right = evaluateNodeQuantity(rightNode, plainDimension); }
      if (left.dimension !== right.dimension) throw new Error('Cannot add measurements with different units');
      return makeQuantity(applyBasicOperation(left.value, operator, right.value), left.dimension);
    }
    if (leftFixed && !rightFixed) { left = evaluateNodeQuantity(leftNode, plainDimension); right = evaluateNodeQuantity(rightNode, 0); }
    else if (!leftFixed && rightFixed) { left = evaluateNodeQuantity(leftNode, 0); right = evaluateNodeQuantity(rightNode, plainDimension); }
    else { left = evaluateNodeQuantity(leftNode, plainDimension); right = evaluateNodeQuantity(rightNode, plainDimension); }
    const value = applyBasicOperation(left.value, operator, right.value);
    const dimension = operator === '*' ? left.dimension + right.dimension : left.dimension - right.dimension;
    return makeQuantity(value, dimension);
  }

  function evaluateBinaryQuantityFromLeft(left, operator, rightNode, plainDimension = 0) {
    if (rightNode.type === 'percent') {
      const percentValue = evaluateNodeQuantity(rightNode.value, 0).value;
      const rate = percentValue.div(new Fraction(100n));
      switch (operator) {
        case '+': return makeQuantity(left.value.add(left.value.mul(rate)), left.dimension);
        case '-': return makeQuantity(left.value.sub(left.value.mul(rate)), left.dimension);
        case '*': return makeQuantity(left.value.mul(rate), left.dimension);
        case '/': return makeQuantity(left.value.div(percentValue).mul(new Fraction(100n)), left.dimension);
        default: throw new Error('Unsupported operation');
      }
    }
    const rightPlainDimension = (operator === '+' || operator === '-') ? left.dimension : 0;
    const right = evaluateNodeQuantity(rightNode, rightPlainDimension);
    if ((operator === '+' || operator === '-') && left.dimension !== right.dimension) throw new Error('Cannot add measurements with different units');
    return makeQuantity(applyBasicOperation(left.value, operator, right.value), operator === '*' ? left.dimension + right.dimension : operator === '/' ? left.dimension - right.dimension : left.dimension);
  }

  function evaluateNode(node) {
    const plainDimension = state.mode === 'measure' ? 1 : 0;
    return evaluateNodeQuantity(node, plainDimension).value;
  }

  function buildTree(expression) {
    const tokens = tokenize(expression);
    if (!tokens.length) throw new Error('Enter a calculation');
    return parseExpression(tokens);
  }

  function formatDecimal(fraction) {
    if (fraction.d === 1n) return fraction.n.toString();
    const value = fraction.toNumber();
    if (!Number.isFinite(value)) throw new Error('Result is too large');
    const absolute = Math.abs(value);
    if (absolute !== 0 && (absolute < 1e-9 || absolute >= 1e15)) return value.toExponential(10).replace(/\.0+e/, 'e').replace(/(\.\d*?)0+e/, '$1e');
    return Number(value.toPrecision(12)).toString();
  }

  function formatWithCommas(text) {
    const match = String(text).match(/^(-?)(\d+)(\.\d+)?$/);
    if (!match) return String(text);
    return match[1] + match[2].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (match[3] || '');
  }

  function roundFractionToPrecision(fraction, precision) {
    const denominator = BigInt(precision);
    const scaledNumerator = fraction.n * denominator;
    const quotient = scaledNumerator / fraction.d;
    const remainder = Fraction.abs(scaledNumerator % fraction.d);
    const rounded = remainder * 2n >= Fraction.abs(fraction.d) ? quotient + (scaledNumerator >= 0n ? 1n : -1n) : quotient;
    return new Fraction(rounded, denominator);
  }

  function formatMixedNumber(fraction, precision) {
    const rounded = roundFractionToPrecision(fraction, precision);
    const sign = rounded.n < 0n ? '-' : '';
    const absoluteNumerator = Fraction.abs(rounded.n);
    const whole = absoluteNumerator / rounded.d;
    const remainder = absoluteNumerator % rounded.d;
    if (remainder === 0n) return `${sign}${whole}`;
    if (whole === 0n) return `${sign}${remainder}/${rounded.d}`;
    return `${sign}${whole} ${remainder}/${rounded.d}`;
  }

  function formatFeetInches(fraction, precision) {
    const rounded = roundFractionToPrecision(fraction, precision);
    const sign = rounded.n < 0n ? '-' : '';
    const absolute = new Fraction(Fraction.abs(rounded.n), rounded.d);
    const totalUnits = absolute.n * BigInt(precision) / absolute.d;
    const unitsPerFoot = 12n * BigInt(precision);
    const feet = totalUnits / unitsPerFoot;
    const inchUnits = totalUnits % unitsPerFoot;
    const inches = new Fraction(inchUnits, BigInt(precision));
    const inchText = formatMixedNumber(inches, precision);
    if (feet === 0n) return `${sign}${inchText}"`;
    if (inchUnits === 0n) return `${sign}${feet}'`;
    return `${sign}${feet}' ${inchText}"`;
  }

  function formatAreaSquareInches(fraction) { return `${formatWithCommas(formatDecimalMeasurement(fraction))} sq in`; }
  function formatAreaSquareFeet(fraction) {
    const squareFeet = fraction.div(new Fraction(144n));
    return `${formatWithCommas(formatDecimalMeasurement(squareFeet))} sq ft`;
  }

  function formatResult(fraction, mode = state.mode, dimension = state.currentDimension) {
    if (mode === 'standard' || dimension === 0) return formatWithCommas(formatDecimal(fraction));
    if (dimension === 2) return state.resultAsFeet ? formatAreaSquareFeet(fraction) : formatAreaSquareInches(fraction);
    if (dimension !== 1) return `${formatWithCommas(formatDecimal(fraction))} in^${dimension}`;
    return state.resultAsFeet ? formatFeetInches(fraction, state.precision) : `${formatMixedNumber(fraction, state.precision)}"`;
  }

  function formatDecimalMeasurement(fraction, places = 4) {
    const value = fraction.toNumber();
    if (!Number.isFinite(value)) throw new Error('Result is too large');
    const rounded = Number(value.toFixed(places));
    return formatWithCommas(String(Object.is(rounded, -0) ? 0 : rounded));
  }

  function hideConversions() {
    conversionResults.hidden = true;
    conversionPrimaryResult.textContent = '';
    conversionSecondaryResult.textContent = '';
  }

  function renderConversions(fraction) {
    if (state.mode !== 'measure' || state.currentDimension === 0) { hideConversions(); return; }
    if (state.currentDimension === 2) {
      const squareInches = formatWithCommas(formatDecimalMeasurement(fraction));
      const squareFeet = formatWithCommas(formatDecimalMeasurement(fraction.div(new Fraction(144n))));
      if (state.resultAsFeet) {
        conversionPrimaryLabel.textContent = 'Total square inches'; conversionPrimaryResult.textContent = `${squareInches} sq in`;
        conversionSecondaryLabel.textContent = 'Decimal square feet'; conversionSecondaryResult.textContent = `${squareFeet} sq ft`;
      } else {
        conversionPrimaryLabel.textContent = 'Total square feet'; conversionPrimaryResult.textContent = `${squareFeet} sq ft`;
        conversionSecondaryLabel.textContent = 'Decimal square inches'; conversionSecondaryResult.textContent = `${squareInches} sq in`;
      }
      conversionResults.hidden = false;
      return;
    }
    if (state.currentDimension !== 1) { hideConversions(); return; }
    if (state.resultAsFeet) {
      const totalInches = formatMixedNumber(fraction, state.precision);
      const decimalFeet = formatDecimalMeasurement(fraction.div(new Fraction(12n)));
      conversionPrimaryLabel.textContent = 'Total inches'; conversionPrimaryResult.textContent = `${totalInches} in`;
      conversionSecondaryLabel.textContent = 'Decimal feet'; conversionSecondaryResult.textContent = `${decimalFeet} ft`;
    } else {
      const totalFeet = formatFeetInches(fraction, state.precision);
      const decimalInches = formatDecimalMeasurement(fraction);
      conversionPrimaryLabel.textContent = 'Total feet'; conversionPrimaryResult.textContent = totalFeet;
      conversionSecondaryLabel.textContent = 'Decimal inches'; conversionSecondaryResult.textContent = `${decimalInches} in`;
    }
    conversionResults.hidden = false;
  }

  function scrollDisplayContentToEnd() {
    requestAnimationFrame(() => {
      display.scrollLeft = display.scrollWidth;
      resultEquation.scrollLeft = resultEquation.scrollWidth;
    });
  }

  function renderCalculatedResult(fraction) {
    const formatted = formatResult(fraction);
    setDisplay(formatted, 'result');
    resultEquation.textContent = state.lastEquation ? `${state.lastEquation} =` : '';
    resultEquation.hidden = !state.lastEquation;
    renderConversions(fraction);
    renderControlRow();
    scrollDisplayContentToEnd();
    return formatted;
  }

  function reusableResultText(fraction) {
    if (state.mode === 'standard' || state.currentDimension === 0) return formatDecimal(fraction);
    if (state.currentDimension !== 1) return formatDecimal(fraction);
    return state.resultAsFeet ? formatFeetInches(fraction, state.precision) : `${formatMixedNumber(fraction, state.precision)}"`;
  }

  function setDisplay(text, kind = 'result', label = '') {
    resultEquation.hidden = true;
    resultEquation.textContent = '';
    display.textContent = text || '0';
    displayLabel.textContent = label || (kind === 'expression' ? 'Entering calculation' : 'Result');
    display.classList.toggle('expression', kind === 'expression');
    display.classList.toggle('error', kind === 'error');
    state.displayError = kind === 'error';
    hideConversions();
    renderControlRow();
    scrollDisplayContentToEnd();
  }

  function renderDisplay() {
    if (state.displayError) return;
    if (state.justCalculated && state.currentResult) { renderCalculatedResult(state.currentResult); return; }
    if (state.input) { setDisplay(state.input, 'expression'); return; }
    setDisplay('0', 'result', 'Ready');
  }

  function renderControlRow() {
    const isMeasure = state.mode === 'measure';
    const hasConvertibleResult = isMeasure && state.justCalculated && state.currentResult && state.currentDimension > 0;
    const isArea = hasConvertibleResult && state.currentDimension === 2;
    modeToggle.textContent = isMeasure ? 'Measure' : 'Standard';
    modeToggle.classList.toggle('measure-active', isMeasure);
    modeToggle.setAttribute('aria-pressed', String(isMeasure));
    feetButton.innerHTML = isArea ? 'FT²' : `FT <span>'</span>`;
    inchesButton.innerHTML = isArea ? 'IN²' : `IN <span>&quot;</span>`;
    const unitUnavailable = !isMeasure || (state.justCalculated && state.currentResult && state.currentDimension === 0);
    feetButton.disabled = unitUnavailable;
    inchesButton.disabled = unitUnavailable;
    const feetActive = Boolean(hasConvertibleResult && state.resultAsFeet);
    const inchesActive = Boolean(hasConvertibleResult && !state.resultAsFeet);
    feetButton.classList.toggle('active', feetActive);
    inchesButton.classList.toggle('active', inchesActive);
    feetButton.setAttribute('aria-pressed', String(feetActive));
    inchesButton.setAttribute('aria-pressed', String(inchesActive));
  }

  function greatestCommonDivisor(a, b) {
    while (b !== 0) { [a, b] = [b, a % b]; }
    return Math.abs(a) || 1;
  }

  function buildFractionLabels(denominator) {
    return Array.from({ length: denominator - 1 }, (_, index) => {
      const numerator = index + 1;
      const divisor = greatestCommonDivisor(numerator, denominator);
      return `${numerator / divisor}/${denominator / divisor}`;
    });
  }

  function updateFractionNavigation() {
    const maxScroll = Math.max(0, fractionPalette.scrollWidth - fractionPalette.clientWidth);
    const tolerance = 2;
    fractionPrev.disabled = fractionPalette.scrollLeft <= tolerance;
    fractionNext.disabled = fractionPalette.scrollLeft >= maxScroll - tolerance;
  }

  function scrollFractions(direction) {
    const amount = Math.max(56, fractionPalette.clientWidth - 56);
    fractionPalette.scrollBy({ left: direction * amount, behavior: 'smooth' });
  }

  function renderFractionPalette() {
    const labels = buildFractionLabels(state.precision);
    fractionPalette.innerHTML = labels.map(label => `<button type="button" data-fraction="${label}">${label}</button>`).join('');
    fractionPalette.scrollLeft = 0;
    requestAnimationFrame(updateFractionNavigation);
  }

  function renderMode() {
    const isMeasure = state.mode === 'measure';
    measureTools.hidden = !isMeasure;
    renderFractionPalette();
    fractionBrowser.hidden = !isMeasure;
    keypadStandard.hidden = isMeasure;
    keypadMeasure.hidden = !isMeasure;
    document.querySelectorAll('#precisionButtons button').forEach(button => {
      const active = Number(button.dataset.precision) === state.precision;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    renderControlRow();
  }

  function renderPendingOperator() {
    document.querySelectorAll('[data-operator]').forEach(button => button.classList.remove('pending'));
    const match = state.input.trim().match(/([+\-×÷])$/);
    if (!match) return;
    const normalized = normalizeOperators(match[1]);
    const button = [...document.querySelectorAll('[data-operator]')].find(candidate => candidate.dataset.operator === normalized);
    button?.classList.add('pending');
  }

  function renderAll() { renderMode(); renderDisplay(); renderPendingOperator(); }

  function announce(message) {
    announcer.textContent = '';
    requestAnimationFrame(() => { announcer.textContent = message; });
  }

  function showToast(message) {
    toastElement.textContent = message;
    toastElement.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastElement.classList.remove('show'), 1500);
  }

  function escapeHTMLForTag(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#39;'}[c]));
  }

  function updateMemoryDisplay() {
    memoryBank.innerHTML = scrapMemory.map((scrap, index) => `
      <button type="button" class="memory-tag" data-memory-index="${index}">
        ${escapeHTMLForTag(scrap)}
      </button>
    `).join('');
  }

  function addMemory() {
    vibrate();
    if (state.justCalculated && state.currentResult) {
      const currentDisplay = display.textContent;
      scrapMemory.push(currentDisplay);
      updateMemoryDisplay();
      saveState();
      showToast('Scrap saved');
    } else {
      showToast('Calculate a result first');
    }
  }

  function clearMemory() {
    vibrate();
    scrapMemory = [];
    updateMemoryDisplay();
    saveState();
    showToast('Scrap memory cleared');
  }

  function useMemory(index) {
    vibrate();
    const scrapText = scrapMemory[index];
    prepareForFreshValue();
    if (/\d$/.test(state.input) && !state.input.trim().endsWith("'") && !state.input.trim().endsWith('"')) {
       state.input += ` ${scrapText}`;
       state.evalInput += ` ${scrapText}`;
    } else {
       state.input += scrapText;
       state.evalInput += scrapText;
    }
    renderDisplay();
    saveState();
  }

  function saveState() {
    try {
      const lastCalculation = state.justCalculated && state.currentResult ? {
        numerator: state.currentResult.n.toString(), denominator: state.currentResult.d.toString(),
        dimension: state.currentDimension, resultAsFeet: state.resultAsFeet, equation: state.lastEquation
      } : null;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ mode: state.mode, precision: state.precision, lastCalculation, scrapMemory }));
    } catch (error) { console.warn('Calculator state could not be saved.', error); }
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      const parsed = JSON.parse(saved);
      state.mode = parsed.mode === 'measure' ? 'measure' : 'standard';
      state.precision = [8, 16, 32].includes(parsed.precision) ? parsed.precision : 16;
      if (Array.isArray(parsed.scrapMemory)) {
        scrapMemory = parsed.scrapMemory;
        updateMemoryDisplay();
      }
      const last = parsed.lastCalculation;
      if (last && /^-?\d+$/.test(String(last.numerator)) && /^\d+$/.test(String(last.denominator))) {
        const dimension = Number(last.dimension);
        if (Number.isInteger(dimension) && dimension >= 0 && dimension <= 2) {
          state.currentResult = new Fraction(BigInt(last.numerator), BigInt(last.denominator));
          state.currentDimension = dimension; state.resultAsFeet = Boolean(last.resultAsFeet);
          state.lastEquation = String(last.equation || ''); state.justCalculated = true;
          state.input = reusableResultText(state.currentResult);
          state.evalInput = encodeQuantity(state.currentResult, state.currentDimension);
        }
      }
    } catch (error) { console.warn('Calculator state could not be loaded.', error); }
  }

  function clearError() {
    if (!state.displayError) return;
    state.displayError = false; state.input = ''; state.evalInput = ''; state.justCalculated = false;
  }

  function prepareForFreshValue() {
    clearError();
    if (state.justCalculated) {
      state.input = ''; state.evalInput = ''; state.justCalculated = false;
      state.repeatOperation = null; state.lastEquation = ''; state.resultAsFeet = false; state.currentDimension = 0;
    }
  }

  function addValue(value) {
    vibrate(); prepareForFreshValue();
    if (value === '.') {
      const currentSegment = state.input.split(/[+\-×÷*/()\s]/).pop() || '';
      if (currentSegment.includes('.')) return;
      if (!currentSegment) { state.input += '0'; state.evalInput += '0'; }
    }
    state.input += value; state.evalInput += value;
    renderDisplay(); renderPendingOperator(); saveState();
  }

  function addFraction(fractionText) {
    vibrate(); prepareForFreshValue();
    if (/\d$/.test(state.input)) { state.input += ` ${fractionText}`; state.evalInput += ` ${fractionText}`; }
    else { state.input += fractionText; state.evalInput += fractionText; }
    renderDisplay(); saveState();
  }

  function addOperator(operator) {
    vibrate(); clearError();
    const symbol = formatOperator(operator);
    if (state.justCalculated && state.currentResult) {
      state.input = formatResult(state.currentResult);
      state.evalInput = encodeQuantity(state.currentResult, state.currentDimension);
      state.justCalculated = false; state.repeatOperation = null;
    }
    const trimmed = state.input.trim(); const evalTrimmed = state.evalInput.trim();
    if (!trimmed) {
      if (operator === '-') { state.input = '-'; state.evalInput = '-'; }
      renderDisplay(); return;
    }
    if (/[+\-×÷]$/.test(trimmed)) {
      state.input = `${trimmed.slice(0, -1).trim()} ${symbol} `;
      state.evalInput = `${evalTrimmed.slice(0, -1).trim()} ${symbol} `;
    } else {
      state.input = `${trimmed} ${symbol} `;
      state.evalInput = `${evalTrimmed} ${symbol} `;
    }
    renderDisplay(); renderPendingOperator(); renderControlRow(); saveState();
  }

  function addPercent() {
    vibrate(); clearError();
    if (/[\d)"]$/.test(state.input.trim())) {
      state.input = `${state.input.trim()}%`; state.evalInput = `${state.evalInput.trim()}%`;
      state.justCalculated = false; renderDisplay(); saveState();
    }
  }

  function addParenthesis(mark) {
    vibrate(); prepareForFreshValue();
    const trimmed = state.input.trim();
    if (mark === '(') {
      if (/[\d)'"]$/.test(trimmed)) { state.input += ' × '; state.evalInput += ' × '; }
      state.input += '('; state.evalInput += '(';
    } else {
      const opens = (state.input.match(/\(/g) || []).length;
      const closes = (state.input.match(/\)/g) || []).length;
      if (opens <= closes || !/[\d)%'"]$/.test(trimmed)) return;
      state.input = `${state.input.trimEnd()})`; state.evalInput = `${state.evalInput.trimEnd()})`;
    }
    renderDisplay(); saveState();
  }

  function addFractionSlash() {
    vibrate(); clearError();
    if (/\d$/.test(state.input) && !/\/\d*$/.test(state.input)) {
      state.input += '/'; state.evalInput += '/'; state.justCalculated = false;
      renderDisplay(); saveState();
    }
  }

  function useUnit(unit) {
    vibrate(); clearError();
    if (state.mode !== 'measure') return;
    if (state.justCalculated && state.currentResult) {
      if (state.currentDimension === 0) return;
      state.resultAsFeet = unit === 'feet';
      state.input = reusableResultText(state.currentResult);
      state.evalInput = encodeQuantity(state.currentResult, state.currentDimension);
      const formatted = renderCalculatedResult(state.currentResult);
      saveState(); return;
    }
    const trimmed = state.input.trim();
    if (!/\d$/.test(trimmed)) return;
    const mark = unit === 'feet' ? "' " : '"';
    state.input += mark; state.evalInput += mark;
    state.justCalculated = false; renderDisplay(); renderControlRow(); saveState();
  }

  function backspace() {
    vibrate(); clearError();
    if (state.justCalculated) {
      state.input = ''; state.evalInput = ''; state.justCalculated = false; state.repeatOperation = null;
    } else {
      const internalQuantity = state.evalInput.match(INTERNAL_QUANTITY_RE);
      const internalRemainder = internalQuantity ? state.evalInput.slice(internalQuantity[0].length).trim() : null;
      if (internalQuantity && !internalRemainder) {
        state.input = ''; state.evalInput = ''; state.currentResult = null; state.currentDimension = 0;
      } else {
        state.input = state.input.trimEnd().slice(0, -1).trimEnd(); state.evalInput = state.evalInput.trimEnd().slice(0, -1).trimEnd();
      }
    }
    renderDisplay(); renderPendingOperator(); renderControlRow(); saveState();
  }

  function clearAll() {
    vibrate(); state.input = ''; state.evalInput = ''; state.currentResult = null;
    state.repeatOperation = null; state.lastEquation = ''; state.justCalculated = false;
    state.displayError = false; state.resultAsFeet = false; state.currentDimension = 0;
    setDisplay('0', 'result', 'Ready'); renderPendingOperator(); saveState();
  }

  function toggleCurrentOperandSign(text) {
    const trimmed = text.trimEnd();
    if (!trimmed) return '-';
    let depth = 0; let start = 0;
    for (let index = trimmed.length - 1; index >= 0; index -= 1) {
      const character = trimmed[index];
      if (character === ')') depth += 1;
      else if (character === '(') depth -= 1;
      else if (depth === 0 && '+-×÷*/'.includes(character) && /\s/.test(trimmed[index - 1] || '') && /\s/.test(trimmed[index + 1] || '')) {
        start = index + 1; break;
      }
    }
    const prefix = trimmed.slice(0, start); const operand = trimmed.slice(start).trimStart();
    const spacing = trimmed.slice(start, trimmed.length - operand.length);
    const toggled = operand.startsWith('-') ? operand.slice(1).trimStart() : `-${operand}`;
    return prefix + spacing + toggled;
  }

  function toggleSignAfterOperator(text) {
    if (/(?:\s[+\-×÷*/]\s*|\(\s*)-\s*$/.test(text)) return text.replace(/-\s*$/, '');
    if (/(?:\s[+\-×÷*/]\s*|\(\s*)$/.test(text)) return `${text}-`;
    return null;
  }

  function toggleSign() {
    vibrate(); clearError();
    if (state.justCalculated && state.currentResult) {
      state.currentResult = state.currentResult.neg();
      state.input = reusableResultText(state.currentResult);
      state.evalInput = encodeQuantity(state.currentResult, state.currentDimension);
      renderCalculatedResult(state.currentResult); saveState(); return;
    }
    const inputBoundaryToggle = toggleSignAfterOperator(state.input);
    const evalBoundaryToggle = toggleSignAfterOperator(state.evalInput);
    if (inputBoundaryToggle !== null && evalBoundaryToggle !== null) {
      state.input = inputBoundaryToggle; state.evalInput = evalBoundaryToggle;
    } else {
      state.input = toggleCurrentOperandSign(state.input); state.evalInput = toggleCurrentOperandSign(state.evalInput);
    }
    state.justCalculated = false; renderDisplay(); saveState();
  }

  function nodeToDisplay(node, parentPrecedence = 0) {
    const precedence = currentNode => {
      if (currentNode.type === 'binary') return ['+', '-'].includes(currentNode.operator) ? 1 : 2;
      if (currentNode.type === 'unary') return 3;
      if (currentNode.type === 'percent') return 4;
      return 5;
    };
    let text;
    switch (node.type) {
      case 'number': text = node.value.d === 1n ? node.value.n.toString() : `${node.value.n}/${node.value.d}`; break;
      case 'unary': text = `-${nodeToDisplay(node.value, precedence(node))}`; break;
      case 'percent': text = `${nodeToDisplay(node.value, precedence(node))}%`; break;
      case 'binary': text = `${nodeToDisplay(node.left, precedence(node))} ${formatOperator(node.operator)} ${nodeToDisplay(node.right, precedence(node) + 0.1)}`; break;
      default: text = '';
    }
    return precedence(node) < parentPrecedence ? `(${text})` : text;
  }

  function calculate() {
    vibrate(); clearError();
    try {
      let expression; let result;
      if (state.mode === 'standard' && state.justCalculated && state.currentResult && state.repeatOperation) {
        expression = `${formatResult(state.currentResult)} ${formatOperator(state.repeatOperation.operator)} ${state.repeatOperation.label}`;
        const repeated = evaluateBinaryQuantityFromLeft(makeQuantity(state.currentResult, state.currentDimension), state.repeatOperation.operator, state.repeatOperation.rightNode, 0);
        result = repeated.value; state.currentDimension = repeated.dimension;
      } else {
        expression = state.input.trim(); const evaluationExpression = state.evalInput.trim();
        if (!expression || !evaluationExpression) return;
        const tree = buildTree(evaluationExpression);
        const evaluated = evaluateNodeQuantity(tree, state.mode === 'measure' ? 1 : 0);
        result = evaluated.value; state.currentDimension = evaluated.dimension;
        if (state.currentDimension < 0) throw new Error('This calculation creates an inverse measurement');
        if (state.currentDimension > 2) throw new Error('This calculator currently supports length and area');
        if (state.mode === 'measure' && !evaluationExpression.includes('[[Q:')) state.resultAsFeet = expression.includes("'");
        state.repeatOperation = state.mode === 'standard' && tree.type === 'binary' ? { operator: tree.operator, rightNode: tree.right, label: nodeToDisplay(tree.right) } : null;
      }
      state.lastEquation = expression; state.currentResult = result;
      state.input = reusableResultText(result);
      state.evalInput = encodeQuantity(result, state.currentDimension);
      state.justCalculated = true; state.displayError = false;
      const formatted = renderCalculatedResult(result);
      renderPendingOperator(); saveState();
    } catch (error) {
      state.lastEquation = ''; state.displayError = true;
      setDisplay(error.message || 'Unable to calculate', 'error', 'Check the calculation');
    }
  }

  async function copyText(text, successMessage = 'Copied') {
    try {
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
    } catch (error) {
      const textArea = document.createElement('textarea');
      textArea.value = text; textArea.style.position = 'fixed'; textArea.style.opacity = '0';
      document.body.appendChild(textArea); textArea.select();
      const copied = document.execCommand('copy');
      textArea.remove();
      showToast(copied ? successMessage : 'Copy failed');
    }
  }

  function switchMode(mode) {
    if (!['standard', 'measure'].includes(mode) || mode === state.mode) return;
    state.mode = mode; state.input = ''; state.evalInput = ''; state.currentResult = null;
    state.repeatOperation = null; state.lastEquation = ''; state.justCalculated = false;
    state.displayError = false; state.resultAsFeet = false; state.currentDimension = 0;
    renderAll(); saveState();
  }

  function handleKeypadClick(event) {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.value !== undefined) addValue(button.dataset.value);
    else if (button.dataset.operator) addOperator(button.dataset.operator);
    else if (button.dataset.fraction) addFraction(button.dataset.fraction);
    else {
      switch (button.dataset.action) {
        case 'clear': clearAll(); break;
        case 'backspace': backspace(); break;
        case 'percent': addPercent(); break;
        case 'sign': toggleSign(); break;
        case 'equals': calculate(); break;
        case 'open-paren': addParenthesis('('); break;
        case 'close-paren': addParenthesis(')'); break;
        case 'fraction-slash': addFractionSlash(); break;
      }
    }
  }

  function handleKeyboard(event) {
    if (event.target.closest?.('button') && (event.key === 'Enter' || event.key === ' ')) return;
    if (/^[0-9]$/.test(event.key)) addValue(event.key);
    else if (event.key === '.') addValue('.');
    else if (['+', '-', '*'].includes(event.key)) addOperator(event.key);
    else if (event.key === '/') {
      event.preventDefault();
      if (state.mode === 'measure' && /\d$/.test(state.input) && !/\/\d*$/.test(state.input)) addFractionSlash();
      else addOperator('/');
    } else if (event.key === '%') addPercent();
    else if (event.key === '(' || event.key === ')') addParenthesis(event.key);
    else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); calculate(); }
    else if (event.key === 'Backspace') { event.preventDefault(); backspace(); }
    else if (event.key === 'Escape') clearAll();
    else if (event.key.toLowerCase() === 'c' && !event.ctrlKey && !event.metaKey) { copyText(display.textContent, 'Display copied'); }
  }

  $('calculatorApp').addEventListener('click', event => {
    if (event.target.closest('.keypad, #fractionPalette')) handleKeypadClick(event);
  });
  
  $('memoryTools').addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.action === 'memory-add') addMemory();
    else if (button.dataset.action === 'memory-clear') clearMemory();
    else if (button.dataset.memoryIndex !== undefined) useMemory(Number(button.dataset.memoryIndex));
  });

  modeToggle.addEventListener('click', () => switchMode(state.mode === 'standard' ? 'measure' : 'standard'));
  feetButton.addEventListener('click', () => useUnit('feet'));
  inchesButton.addEventListener('click', () => useUnit('inches'));

  $('precisionButtons').addEventListener('click', event => {
    const button = event.target.closest('[data-precision]');
    if (!button) return;
    state.precision = Number(button.dataset.precision);
    renderMode();
    if (state.currentResult && state.justCalculated) {
      state.input = reusableResultText(state.currentResult);
      state.evalInput = encodeQuantity(state.currentResult, state.currentDimension);
      renderCalculatedResult(state.currentResult);
    }
    saveState();
  });

  fractionPrev.addEventListener('click', () => scrollFractions(-1));
  fractionNext.addEventListener('click', () => scrollFractions(1));
  fractionPalette.addEventListener('scroll', updateFractionNavigation, { passive: true });
  window.addEventListener('resize', updateFractionNavigation);
  display.addEventListener('click', () => copyText(display.textContent, 'Display copied'));
  conversionPrimaryButton.addEventListener('click', () => { if (conversionPrimaryResult.textContent) copyText(conversionPrimaryResult.textContent, 'Conversion copied'); });
  conversionSecondaryButton.addEventListener('click', () => { if (conversionSecondaryResult.textContent) copyText(conversionSecondaryResult.textContent, 'Conversion copied'); });
  document.addEventListener('keydown', handleKeyboard);

  loadState();
  renderAll();
})();
</script>
</body>
</html>
